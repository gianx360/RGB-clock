<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RGB Clock</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      transition: background-color 1s linear;
      overflow: hidden;
    }

    #title {
      position: absolute;
      top: 100px;
      font-size: 1.5rem;
      color: white;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }

    #clock {
      font-size: 5rem;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
      letter-spacing: 4px;
    }

    #rgb {
      margin-top: 20px;
      font-size: 1.5rem;
      color: white;
      opacity: 0.85;
      text-shadow: 0 0 20px rgba(0,0,0,0.9);
    }

    /* Bottom centre help button */
    #helpBtn {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      background: rgba(255,255,255,0.25);
      color: white;
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
    }

    #helpBtn:hover {
      background: rgba(255,255,255,0.4);
      transform: translateX(-50%) scale(1.05);
    }

    /* Explanation panel */
    #info {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 14px;
      line-height: 1.4;

      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    #info.show {
      max-height: 300px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="title">What colour is the time?</div>
  <div id="clock">00:00:00</div>
  <div id="rgb">rgb(0,0,0)</div>

  <!-- Help button -->
  <button id="helpBtn">?</button>

  <!-- Hidden explanation -->
  <div id="info">
    This RGB clock converts time into colour. The hour controls red, the minute controls green, and the second controls blue. Each value is scaled into the 0–255 RGB range. The background updates every second to reflect the current time as a colour.
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const hh = String(hours).padStart(2, '0');
      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');

      document.getElementById('clock').textContent =
        `${hh}:${mm}:${ss}`;

      const r = Math.floor((hours / 23) * 255);
      const g = Math.floor((minutes / 59) * 255);
      const b = Math.floor((seconds / 59) * 255);

      const rgb = `rgb(${r}, ${g}, ${b})`;

      document.body.style.backgroundColor = rgb;
      document.getElementById('rgb').textContent = rgb;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // Toggle info panel
    const btn = document.getElementById("helpBtn");
    const info = document.getElementById("info");

    btn.addEventListener("click", () => {
      info.classList.toggle("show");
    });
  </script>

</body>
</html>
